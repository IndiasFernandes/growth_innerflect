<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerflect — Regeneration Cycle</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c5f4e;
            --primary-light: #4a9d7f;
            --primary-dark: #1a3d2e;
            --accent: #d4a574;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: auto;
        }

        .mermaid {
            text-align: center;
        }
    </style>
    <script>
        mermaid.initialize({ 
            startOnLoad: true, 
            theme: 'default',
            themeVariables: { 
                primaryColor: '#4a9d7f',
                primaryTextColor: '#1f2937',
                primaryBorderColor: '#2c5f4e',
                lineColor: '#4a9d7f',
                secondaryColor: '#f5e6d3',
                tertiaryColor: '#d4a574'
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Regeneration Through Efficiency</h1>
        <div class="diagram-container">
            <div class="mermaid">
                graph TD
                    A[REVENUE<br/>€9k-€86k/mo] -->|funds| B[OPERATIONS<br/>SpotPulse]
                    B -->|reduces| C[WASTE<br/>Less food/water/energy]
                    C -->|enables| D[REGENERATION<br/>Better efficiency]
                    D -->|creates| A
            </div>
        </div>
    </div>
</body>
</html>
